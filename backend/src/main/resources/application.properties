spring.application.name=urban-risk-api

# Escuta em todas as interfaces para o celular (Expo Go) acessar pela rede local
server.port=8080
server.address=0.0.0.0

# Simulação dos sensores
# intervalo entre leituras (o app recebe uma atualização a cada ciclo)
app.simulacao.intervalo-ms=2000
# dispara sozinho uma tempestade/onda de calor/apagão em uma área de tempos em tempos
app.simulacao.eventos-automaticos=true
app.simulacao.intervalo-eventos-segundos=120

management.endpoints.web.exposure.include=health,info
logging.level.br.com.fiap.urbanrisk=INFO
